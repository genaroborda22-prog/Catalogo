    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #d4af37;
            --accent-hover: #f39c12;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        header p {
            color: #aaa;
            font-size: 1.1rem;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 40px auto;
        }

        .search-input {
            width: 100%;
            padding: 15px 20px;
            font-size: 1rem;
            border-radius: 30px;
            border: 2px solid #333;
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--accent-color);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .perfume-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .perfume-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.2);
        }

        .image-box {
            width: 100%;
            height: 220px;
            background-color: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
        }

        .perfume-info {
            padding: 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .perfume-title {
            font-size: 1rem;
            font-weight: 500;
            color: #fff;
            margin-bottom: 15px;
        }

        .btn-details {
            background-color: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background-color 0.3s, color 0.3s;
        }

        .btn-details:hover {
            background-color: var(--accent-color);
            color: #000;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 2rem;
            }
            .grid-container {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }
        }
    </style>
</head>

        function renderPerfumes(list) {
            const grid = document.getElementById('perfumeGrid');
            grid.innerHTML = '';

            list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'perfume-card';

                card.innerHTML = `
                    <div class="image-box">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="perfume-info">
                        <h3 class="perfume-title">${item.name}</h3>
                        <button class="btn-details" onclick="alert('Detalles de: ${item.name}')">Ver más</button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterPerfumes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = perfumes.filter(p => p.name.toLowerCase().includes(query));
            renderPerfumes(filtered);
        }

        renderPerfumes(perfumes);
    </script>
